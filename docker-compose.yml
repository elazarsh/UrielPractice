version: '3.9'

# ⚠️  כל הסיסמאות והסודות נטענים מקובץ .env (לא ב-git!)
# הפעלה ראשונה: cp .env.example .env && nano .env

services:
  # ─────────────────────────────────────────────
  # PostgreSQL
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: uriel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Backend (Fastify API)
  # ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uriel-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      PORT: ${PORT:-3001}
      NODE_ENV: ${NODE_ENV:-production}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-50}
    volumes:
      - uploads_data:/app/uploads
    ports:
      - '3001:3001'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3001/api/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3

  # ─────────────────────────────────────────────
  # Frontend (React + Nginx)
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
    container_name: uriel-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '80:80'

  # ─────────────────────────────────────────────
  # Telegram Bot (פולינג + פקודות)
  # ─────────────────────────────────────────────
  telegram-bot:
    build:
      context: .
      dockerfile: bots/Dockerfile.telegram
    container_name: uriel-telegram-bot
    restart: unless-stopped
    volumes:
      # כל הפרויקט: read-only (הבוט רק קורא קבצים)
      - /home/user/UrielPractice:/workspace:ro
      # progress.log: writable כי שאר הסקריפטים כותבים אליו
      - /home/user/UrielPractice/progress.log:/workspace/progress.log
    environment:
      - TZ=Asia/Jerusalem
    # TELEGRAM_BOT_TOKEN ו-TELEGRAM_CHAT_ID נקראים מהקובץ /workspace/.env.telegram
    # (מותקן אוטומטית מ-/home/user/UrielPractice/.env.telegram)
    profiles:
      - with-telegram
    healthcheck:
      test: ['CMD-SHELL', 'pgrep -f telegram-poll.sh || exit 1']
      interval: 60s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  uploads_data:
